name: 공고 업데이트

on:
  schedule:
    - cron: "17 20 * * *"   # 매일 오전 5:17 (한국시간)
    - cron: "17 8 * * *"    # 매일 오후 5:17 (한국시간)
  workflow_dispatch:         # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 공고 받아오기
        run: python fetch_jobs.py
        env:
          JOB_API_KEY: ${{ secrets.JOB_API_KEY }}
          WORK24_API_KEY: ${{ secrets.WORK24_API_KEY }}
      - name: 변경분 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "공고 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git push
